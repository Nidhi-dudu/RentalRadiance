<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Rental Radiance</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #EDEDE9;
            color: #5C4033;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background-color: #D6CCC2;
            padding: 20px;
        }
        .logo {
            display: flex;
            align-items: center;
        }
        .logo img {
            height: 60px;
            margin-right: 15px;
        }
        .site-name {
            font-size: 48px;
            font-weight: bold;
            font-family: 'Playfair Display', serif;
            color: #5C4033;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #E3D5CA;
            padding: 15px;
            gap: 20px;
        }
        nav a {
            color: #5C4033;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 15px;
            transition: 0.3s;
        }
        nav a:hover {
            background-color: #D5BDAF;
            border-radius: 5px;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            background-color: #F5EBE0;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .wishlist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #D5BDAF;
            padding: 10px 0;
        }
        .wishlist-item img {
            width: 80px;
            border-radius: 5px;
        }
        .wishlist-item .info {
            flex: 1;
            margin-left: 15px;
        }
        .wishlist-item h3 {
            margin: 0;
            font-size: 18px;
            color: #5C4033;
        }
        .wishlist-item p {
            margin: 5px 0;
            font-size: 14px;
            color: #5C4033;
        }
        .wishlist-item .actions {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .remove-btn {
            background-color: #D5BDAF;
            color: #5C4033;
        }
        .cart-btn {
            background-color: #D5BDAF;
            color: #5C4033;
        }
        .empty-message {
            text-align: center;
            font-size: 18px;
            color: #5C4033;
        }
    </style>
</head>
<body>

<!-- Header -->
<header>
    <div class="logo">
        <img src="logo.png" alt="Rental Radiance Logo">
        <span class="site-name">Rental Radiance</span>
    </div>
</header>
<nav>
    <a href="Mainpage.html">Home</a>
    <a href="rental.html">Rentals</a>
    <a href="designer.html">Designers</a>
    <a href="cart.html">Cart</a>
    <a href="wishlist.html">Wishlist</a>
</nav>

<!-- Wishlist Container -->
<div class="container" id="wishlist-container">
    <p class="empty-message">Your wishlist is empty. Start adding dresses!</p>
</div>

<script>
    // Fetch wishlist from localStorage
    let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

    // Wishlist container
    const wishlistContainer = document.getElementById("wishlist-container");

    function displayWishlist() {
        wishlistContainer.innerHTML = "";

        if (wishlist.length === 0) {
            wishlistContainer.innerHTML = '<p class="empty-message">Your wishlist is empty. Start adding dresses!</p>';
            return;
        }

        wishlist.forEach((item, index) => {
            const wishlistItem = document.createElement("div");
            wishlistItem.classList.add("wishlist-item");

            wishlistItem.innerHTML = `
                <img src="${item.image}" alt="${item.name}">
                <div class="info">
                    <h3>${item.name}</h3>
                    <p>${item.price}</p>
                </div>
                <div class="actions">
                    <button class="cart-btn" onclick="moveToCart(${index})">Move to Cart</button>
                    <button class="remove-btn" onclick="removeFromWishlist(${index})">Remove</button>
                </div>
            `;

            wishlistContainer.appendChild(wishlistItem);
        });
    }

    function removeFromWishlist(index) {
        wishlist.splice(index, 1);
        localStorage.setItem("wishlist", JSON.stringify(wishlist));
        displayWishlist();
    }

    function moveToCart(index) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        cart.push(wishlist[index]);
        localStorage.setItem("cart", JSON.stringify(cart));
        
        removeFromWishlist(index);
        alert("Item moved to cart!");
    }

    displayWishlist();
</script>

</body>
</html>
